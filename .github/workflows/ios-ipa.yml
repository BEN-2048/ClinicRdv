name: iOS IPA

on:
  workflow_dispatch:
    inputs:
      api_url:
        description: URL de l'API (IP du PC qui fait tourner le backend)
        required: true
        default: http://172.20.10.2:4000/api

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_PUBLIC_API_URL: ${{ inputs.api_url }}
      EXPO_NO_TELEMETRY: 1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Générer le projet iOS
        run: npx expo prebuild --platform ios --clean

      - name: Compiler l'application
        run: |
          WORKSPACE=$(ls -d ios/*.xcworkspace | head -n 1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          echo "SCHEME=$SCHEME" >> "$GITHUB_ENV"
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination generic/platform=iOS \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Créer le fichier IPA
        run: |
          mkdir -p Payload
          cp -R "build/Build/Products/Release-iphoneos/$SCHEME.app" Payload/
          zip -qr ClinicRDV.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: ClinicRDV-ipa
          path: mobile/ClinicRDV.ipa
          retention-days: 14
